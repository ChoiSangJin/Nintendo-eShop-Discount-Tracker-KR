name: Signed ARM64 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned official Flutter SDK
        run: |
          git clone --depth 1 --branch "$(cat .flutter-version)" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build, test and verify ARM64 APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: bash tool/build_release.sh
      - name: Verify configured release signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs dist/*.apk > "$RUNNER_TEMP/apk-certificate.txt"
          grep -F 'certificate SHA-256 digest: ebd50026880286899e286b7cab2a240aed5b64a3b19b5a1b12addc6a8d2b8d6e' "$RUNNER_TEMP/apk-certificate.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: switch-sale-tracker-kr-arm64
          path: dist/*
      - name: Publish immutable version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          notes_args=(--generate-notes)
          if [[ -f "release-notes/$tag.md" ]]; then
            notes_args=(--notes-file "release-notes/$tag.md")
          fi
          gh release create "$tag" dist/* --target "$GITHUB_SHA" --title "Switch 할인 트래커 KR $tag" "${notes_args[@]}"
      - name: Remove runner signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
