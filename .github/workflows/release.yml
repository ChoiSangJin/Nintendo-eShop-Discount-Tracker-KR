name: Publish verified v1.4.1 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared APK checksum and ARM64 contents
        working-directory: release-assets
        run: |
          echo 'a4380d7a240ec0cf642213ba5815095f6f82015ba63bea9ab44db47c172b15c5  switch-sale-tracker-kr-arm64-v1.4.1.apk' | sha256sum --check
          sha256sum --check switch-sale-tracker-kr-arm64-v1.4.1.apk.sha256
          python3 ../tool/verify_apk.py switch-sale-tracker-kr-arm64-v1.4.1.apk
      - name: Publish signed APK for merged app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.1 \
            release-assets/switch-sale-tracker-kr-arm64-v1.4.1.apk \
            release-assets/switch-sale-tracker-kr-arm64-v1.4.1.apk.sha256 \
            --target 8836e923a75207669f467a57d279cb9912a9cfe5 \
            --title 'Switch 할인 트래커 KR v1.4.1 · ARM64' \
            --notes-file release-assets/release-notes.md --latest
