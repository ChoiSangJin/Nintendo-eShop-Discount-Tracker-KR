name: Publish verified v1.4.0 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared APK checksum and ARM64 contents
        working-directory: release-assets
        run: |
          echo '5ed1382dc6baa2f46b5d6a347b63767c0a3feb6dd53f53071e8ed9674c8237e0  switch-sale-tracker-kr-arm64-v1.4.0.apk' | sha256sum --check
          sha256sum --check switch-sale-tracker-kr-arm64-v1.4.0.apk.sha256
          python3 ../tool/verify_apk.py switch-sale-tracker-kr-arm64-v1.4.0.apk
      - name: Publish signed APK for merged app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.0 \
            release-assets/switch-sale-tracker-kr-arm64-v1.4.0.apk \
            release-assets/switch-sale-tracker-kr-arm64-v1.4.0.apk.sha256 \
            --target 5d66db3213c771f229db6cb40fc9bf05870bd536 \
            --title 'Switch 할인 트래커 KR v1.4.0 · ARM64' \
            --notes-file release-assets/release-notes.md --latest
