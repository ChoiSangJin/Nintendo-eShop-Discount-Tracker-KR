name: Publish verified v1.4.4 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared APK checksum and ARM64 contents
        working-directory: release-assets
        run: |
          echo '87c456b13d1c89845c25cbee93f0dc1ecf3e460a8fafb3c4d3c98abcd893e59d  switch-sale-tracker-kr-arm64-v1.4.4.apk' | sha256sum --check
          sha256sum --check switch-sale-tracker-kr-arm64-v1.4.4.apk.sha256
          python3 ../tool/verify_apk.py switch-sale-tracker-kr-arm64-v1.4.4.apk
      - name: Publish signed APK for merged app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.4 release-assets/switch-sale-tracker-kr-arm64-v1.4.4.apk release-assets/switch-sale-tracker-kr-arm64-v1.4.4.apk.sha256 --target 9a4240eec1c8ff596311905307f72ec49af19b40 --title 'Switch 할인 트래커 KR v1.4.4 · ARM64' --notes-file release-assets/release-notes.md --latest
