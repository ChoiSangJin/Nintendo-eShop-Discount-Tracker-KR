name: Publish verified v1.4.3 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared APK checksum and ARM64 contents
        working-directory: release-assets
        run: |
          echo 'e8f3a204e1b14edeb93767f538bf1ea7052c8ec25e5b5dbd9749d1146d394b54  switch-sale-tracker-kr-arm64-v1.4.3.apk' | sha256sum --check
          sha256sum --check switch-sale-tracker-kr-arm64-v1.4.3.apk.sha256
          python3 ../tool/verify_apk.py switch-sale-tracker-kr-arm64-v1.4.3.apk
      - name: Publish signed APK for merged app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.3 release-assets/switch-sale-tracker-kr-arm64-v1.4.3.apk release-assets/switch-sale-tracker-kr-arm64-v1.4.3.apk.sha256 --target 76cd668c402ba441b1be0a5ded2a84ca31f0b327 --title 'Switch 할인 트래커 KR v1.4.3 · ARM64' --notes-file release-assets/release-notes.md --latest
