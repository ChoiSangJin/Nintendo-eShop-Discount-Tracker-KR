name: Publish verified v1.4.2 APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify prepared APK checksum and ARM64 contents
        working-directory: release-assets
        run: |
          echo '0bb2e1747c6534d3446554f5071f0775d743e7039372dff84a665fcac5033273  switch-sale-tracker-kr-arm64-v1.4.2.apk' | sha256sum --check
          sha256sum --check switch-sale-tracker-kr-arm64-v1.4.2.apk.sha256
          python3 ../tool/verify_apk.py switch-sale-tracker-kr-arm64-v1.4.2.apk
      - name: Publish signed APK for merged app source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.4.2 \
            release-assets/switch-sale-tracker-kr-arm64-v1.4.2.apk \
            release-assets/switch-sale-tracker-kr-arm64-v1.4.2.apk.sha256 \
            --target cf8202ad074e896a697a3de94714405a752f1ac2 \
            --title 'Switch 할인 트래커 KR v1.4.2 · ARM64' \
            --notes-file release-assets/release-notes.md --latest
