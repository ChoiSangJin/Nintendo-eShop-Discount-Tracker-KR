name: Publish verified ARM64 APK
on:
  push:
    branches: [release/apk-v1.0.0]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK checksum and ARM64 contents
        run: |
          cd distribution
          sha256sum --check switch-sale-tracker-kr-arm64-v1.0.0.apk.sha256
          python3 ../tool/verify_apk.py switch-sale-tracker-kr-arm64-v1.0.0.apk
      - name: Publish APK built from merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: c2c78df2229a1582c78b15fe2fd715ba618d9cd3
        run: |
          set -euo pipefail
          report_error() {
            while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done < /tmp/publish-stderr.log
          }
          trap report_error ERR
          exec 2> /tmp/publish-stderr.log
          tag_sha=$(gh api repos/${{ github.repository }}/git/ref/tags/v1.0.0 --jq '.object.sha' 2>/dev/null || true)
          if [[ -n "$tag_sha" && "$tag_sha" != "$RELEASE_COMMIT" ]]; then
            gh api --method PATCH repos/${{ github.repository }}/git/refs/tags/v1.0.0 -f sha="$RELEASE_COMMIT" -F force=false
          fi
          if gh release view v1.0.0 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload v1.0.0 distribution/*.apk distribution/*.sha256 --repo "${{ github.repository }}"
            gh release edit v1.0.0 --repo "${{ github.repository }}" --draft=false --target "$RELEASE_COMMIT"
          else
            gh release create v1.0.0 distribution/*.apk distribution/*.sha256 --repo "${{ github.repository }}" --target "$RELEASE_COMMIT" --title 'Switch 할인 트래커 KR v1.0.0 · ARM64' --notes-file distribution/release-notes.md
          fi
